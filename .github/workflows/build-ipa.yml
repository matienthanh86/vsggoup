name: "Build VSG Group IPA"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (phải > 9, ví dụ 10, 11)'
        required: false
        default: ''

env:
  browser: firefox-ios
  xcodebuild_scheme: Firefox
  BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
  BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
  P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Xcode
        id: xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          TARGET_XCODE=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | grep -viE "beta|rc|seed" | sort -V | tail -n 1)
          if [ -z "$TARGET_XCODE" ]; then
            TARGET_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -viE "beta|rc|seed" | sort -V | tail -n 1)
          fi
          if [ -z "$TARGET_XCODE" ]; then
            TARGET_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -viE "beta|rc|seed" | sort -V | tail -n 1)
          fi
          if [ -n "$TARGET_XCODE" ]; then
            echo "Selected Xcode: $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE/Contents/Developer"
            for proc in $(find "$TARGET_XCODE" -name "appintentsnltrainingprocessor" 2>/dev/null); do
              echo "Stubbing $proc"
              sudo rm -f "$proc"
              printf '#!/bin/sh\nexit 0\n' | sudo tee "$proc" > /dev/null
              sudo chmod 755 "$proc"
            done
          fi
          xcodebuild -version

      - name: Run Bootstrap
        run: |
          ./bootstrap.sh firefox --force

      - name: Strip Alpha Channel from App Icons
        run: |
          python3 scripts/strip_icon_alpha.py .

      - name: Resolve SPM Dependencies
        working-directory: ${{ env.browser }}
        run: |
          xcodebuild -resolvePackageDependencies -project Client.xcodeproj -onlyUsePackageVersionsFromResolvedFile || xcodebuild -resolvePackageDependencies -project Client.xcodeproj

      - name: Build Archive
        working-directory: ${{ env.browser }}
        run: |
          set -o pipefail

          # Strip any remaining IsolatedDefaultValues flags (multi-line or single-line)
          perl -0777 -pi -e 's/"?-enable-upcoming-feature"?\s*,?\s*"?IsolatedDefaultValues"?\s*,?//g' Client.xcodeproj/project.pbxproj 2>/dev/null || true
          perl -0777 -pi -e 's/SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES\s*=\s*YES/SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES = NO/g' Client.xcodeproj/project.pbxproj 2>/dev/null || true
          find . -name "*.xcconfig" -exec perl -0777 -pi -e 's/-enable-upcoming-feature\s+IsolatedDefaultValues//g' {} + 2>/dev/null || true

          # Ensure no duplicated 'nonisolated nonisolated' modifiers exist
          perl -0777 -pi -e 's/nonisolated\s+nonisolated/nonisolated/g' Client/Frontend/Browser/Toolbars/ToolbarHelper.swift 2>/dev/null || true
          perl -0777 -pi -e 's/nonisolated\s+nonisolated/nonisolated/g' Client/Frontend/Summarizer/SummarizeMiddleware.swift 2>/dev/null || true
          perl -0777 -pi -e 's/nonisolated\s+nonisolated/nonisolated/g' Client/Frontend/Browser/Tabs/TabTrayUtils.swift 2>/dev/null || true
          perl -0777 -pi -e 's/nonisolated\s+nonisolated/nonisolated/g' Client/VPN/VPNManager.swift 2>/dev/null || true

          # Sync all extension Bundle Identifiers with parent app (com.vsg.group.browser)
          perl -0777 -pi -e 's/org\.mozilla\.ios\.(Firefox|FirefoxBeta|Fennec|FennecEnterprise|Focus)/com.vsg.group.browser/g' Client.xcodeproj/project.pbxproj 2>/dev/null || true
          find . \( -name "*.xcconfig" -o -name "*.plist" -o -name "*.entitlements" \) -exec perl -0777 -pi -e 's/org\.mozilla\.ios\.(Firefox|FirefoxBeta|Fennec|FennecEnterprise|Focus)/com.vsg.group.browser/g' {} + 2>/dev/null || true

          xcodebuild archive \
            -project Client.xcodeproj \
            -scheme ${{ env.xcodebuild_scheme }} \
            -configuration Firefox \
            -destination "generic/platform=iOS" \
            -archivePath ../build/Firefox.xcarchive \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_UPCOMING_FEATURE_ISOLATED_DEFAULT_VALUES=NO \
            SWIFT_UPCOMING_FEATURE_GLOBAL_CONCURRENCY=NO \
            SWIFT_UPCOMING_FEATURE_REGION_BASED_ISOLATION=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_OPTIMIZATION_LEVEL=-Osize \
            STRIP_INSTALLED_PRODUCT=YES \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            DEPLOYMENT_POSTPROCESSING=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_APPINTENTS_DEPLOYMENT_AWARE_PROCESSING=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            2>&1 | tee "$RUNNER_TEMP/build-archive.log"

      - name: Print Xcode Build Errors
        if: always()
        run: |
          LOG_FILE="$RUNNER_TEMP/build-archive.log"
          echo "Using log file: $LOG_FILE"
          echo "=== FAILED BUILD COMMANDS ==="
          grep -C 3 -E "The following build commands failed:" "$LOG_FILE" || true
          echo "=== GLEAN / NIMBUS ERRORS ==="
          grep -B 10 -A 20 -E "GLEAN_PARSER|glean_parser|nimbus-fml" "$LOG_FILE" | tail -n 60 || true
          echo "=== ALL COMPILER ERRORS ==="
          grep -B 2 -A 8 -E "error:|fatal error:|Assertion failed|Stack dump:|While evaluating request" "$LOG_FILE" | grep -v "appintentsnltrainingprocessor" | tail -n 200 || true
          echo "=== LAST 300 LINES OF LOG ==="
          tail -n 300 "$LOG_FILE" || true

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: ${{ runner.temp }}/build-archive.log

      - name: Install Apple Certificate
        id: import_cert
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        if: env.BUILD_PROVISION_PROFILE_BASE64 != ''
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$PP_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(strings "$PP_PATH" | grep -A1 "<key>UUID</key>" | tail -n 1 | sed -e 's/<[^>]*>//g' | tr -d '\n\t ')
          echo "Detected Profile UUID: $PROFILE_UUID"
          if [ -n "$PROFILE_UUID" ]; then
            cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/embedded.mobileprovision"

      - name: Package Signed App Store IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/*.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Remove PlugIns folder entirely because only 1 provisioning profile is provided for com.vsg.group.browser.
          # App Extensions (CredentialProvider, ActionExtension, WidgetKit, etc.) require separate App Store provisioning profiles
          # and App IDs registered on Apple Developer portal. Without them, Apple Transporter rejects with ITMS-90166 and ITMS-90729.
          if [ -d "$APP_PATH/PlugIns" ]; then
            echo "Removing PlugIns to prevent Transporter ITMS-90166 / ITMS-90729 missing entitlement errors on extensions..."
            rm -rf "$APP_PATH/PlugIns"
          fi

          # Remove Firefox vector .icon packages which override the VSG Group icon on macOS and iOS 18
          rm -rf "$APP_PATH"/AppIcon*.icon

          # Fix permissions on non-binary files so Transporter/swinfo doesn't treat them as executables
          find "$APP_PATH" -type f \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" -o -name "*.plist" -o -name "*.png" -o -name "*.car" \) -exec chmod 644 {} +

          # Thin all universal binaries to pure arm64 to guarantee lipo passes cleanly
          echo "Ensuring all binaries are thin arm64..."
          find "$APP_PATH" -type f -perm +111 | while read -r bin; do
            if file "$bin" | grep -q "Mach-O"; then
              if lipo -info "$bin" | grep -q "Architectures in the fat file"; then
                echo "Thinning fat binary: $bin"
                lipo -thin arm64 "$bin" -output "$bin.thin" && mv "$bin.thin" "$bin"
              fi
            fi
          done

          # Keep only English (en), Vietnamese (vi), and Base localizations
          echo "Stripping non-en/vi localizations from app bundle..."
          find "$APP_PATH" -type d -name "*.lproj" ! -name "en.lproj" ! -name "vi.lproj" ! -name "Base.lproj" -exec rm -rf {} + 2>/dev/null || true

          # Clean any macOS resource fork dot-files (._*)
          find "$APP_PATH" -name "._*" -delete 2>/dev/null || true
          dot_clean -m "$APP_PATH" 2>/dev/null || true

          # Determine App Store Build Number (CFBundleVersion must be > 9)
          TRACKED_BUILD=$(cat .build_number 2>/dev/null || echo "10")
          INPUT_BUILD="${{ inputs.build_number }}"
          if [ -n "$INPUT_BUILD" ]; then
            TARGET_BUILD="$INPUT_BUILD"
          else
            TARGET_BUILD="$TRACKED_BUILD"
            if [ -z "$TARGET_BUILD" ] || [ "$TARGET_BUILD" -le 9 ]; then
              TARGET_BUILD=10
            fi
          fi
          echo "Target Build Number (CFBundleVersion): $TARGET_BUILD"
          echo "APP_BUILD_NUMBER=$TARGET_BUILD" >> $GITHUB_ENV

          # Ghi đè toàn bộ PNG AppIcon vật lý từ icon VSG Group chuẩn (1024x1024)
          VSG_ICON_SRC="firefox-ios/Client/Assets/AppIcons.xcassets/AppIcon.appiconset/appstore.png"
          if [ -f "$VSG_ICON_SRC" ]; then
            echo "Ghi đè toàn bộ kích thước PNG AppIcon bằng icon VSG Group..."
            sips -z 40 40 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon20x20@2x.png" >/dev/null 2>&1 || true
            sips -z 60 60 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon20x20@3x.png" >/dev/null 2>&1 || true
            sips -z 20 20 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon20x20~ipad.png" >/dev/null 2>&1 || true
            sips -z 40 40 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon20x20@2x~ipad.png" >/dev/null 2>&1 || true
            sips -z 58 58 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon29x29@2x.png" >/dev/null 2>&1 || true
            sips -z 87 87 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon29x29@3x.png" >/dev/null 2>&1 || true
            sips -z 29 29 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon29x29~ipad.png" >/dev/null 2>&1 || true
            sips -z 58 58 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon29x29@2x~ipad.png" >/dev/null 2>&1 || true
            sips -z 80 80 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon40x40@2x.png" >/dev/null 2>&1 || true
            sips -z 120 120 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon40x40@3x.png" >/dev/null 2>&1 || true
            sips -z 40 40 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon40x40~ipad.png" >/dev/null 2>&1 || true
            sips -z 80 80 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon40x40@2x~ipad.png" >/dev/null 2>&1 || true
            sips -z 120 120 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon60x60@2x.png" >/dev/null 2>&1 || true
            sips -z 180 180 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon60x60@3x.png" >/dev/null 2>&1 || true
            sips -z 76 76 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon76x76~ipad.png" >/dev/null 2>&1 || true
            sips -z 152 152 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon76x76@2x~ipad.png" >/dev/null 2>&1 || true
            sips -z 167 167 "$VSG_ICON_SRC" --out "$APP_PATH/AppIcon83.5x83.5@2x~ipad.png" >/dev/null 2>&1 || true
          fi

          # Xóa các icon phụ của Firefox để tránh iOS/App Store lấy nhầm
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons:CFBundleAlternateIcons" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIcons~ipad:CFBundleAlternateIcons" "$APP_PATH/Info.plist" 2>/dev/null || true

          # Khai báo rõ các kích thước icon chính
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles: string AppIcon20x20" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles: string AppIcon29x29" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles: string AppIcon40x40" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles: string AppIcon20x20" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles: string AppIcon29x29" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconFiles: string AppIcon40x40" "$APP_PATH/Info.plist" 2>/dev/null || true

          # Nhúng và vá icon VSG Group vào Assets.car (chuẩn KCBC LZFSE, Opaque: True)
          ASSETS_CAR="$APP_PATH/Assets.car"
          if [ -f "$ASSETS_CAR" ] && [ -f "$VSG_ICON_SRC" ]; then
            echo "Nhúng 100% icon VSG Group vào Assets.car..."
            VSG_ICON_SRC="$VSG_ICON_SRC" VSG_DARK_SRC="firefox-ios/Client/Assets/AppIcons.xcassets/AppIcon.appiconset/appstore-dark.png" ASSETS_CAR="$ASSETS_CAR" python3 scripts/patch_assets_car.py || true
          fi

          # Patch Display Name and Build Number in Info.plist (keep native GM Xcode 26 / iOS 26 SDK metadata untouched)
          echo "Patching CFBundleVersion ($TARGET_BUILD) in Info.plist..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName VSG Group" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string VSG Group" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName VSG Group" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string VSG Group" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion vi" "$APP_PATH/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string vi" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string en" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string vi" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string vi" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string en" "$APP_PATH/Info.plist" 2>/dev/null || true

          find "$APP_PATH" -name "Info.plist" | while read -r plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TARGET_BUILD" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $TARGET_BUILD" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$plist" 2>/dev/null || true
          done

          # Codesign for App Store (if cert is available) or ad-hoc sign for test
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="${{ steps.import_cert.outputs.keychain-path }}"
          if [ -z "$KEYCHAIN_PATH" ]; then
            KEYCHAIN_PATH=$(security list-keychains -d user | tr -d '" ' | head -n 1)
          fi
          echo "Using keychain: $KEYCHAIN_PATH"

          # Detect codesigning identity (Distribution, Development, or any valid identity)
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep -E "Apple Distribution|iPhone Distribution|Apple Development|iPhone Developer" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | grep ')' | head -n 1 | awk -F '"' '{print $2}')
          fi

          if [ -f "$PP_PATH" ] && [ -n "$SIGNING_IDENTITY" ]; then
            echo "Embedding App Store Provisioning Profile..."
            cp "$PP_PATH" "$APP_PATH/embedded.mobileprovision"

            echo "Re-signing app with official identity: $SIGNING_IDENTITY"
            # Extract entitlements from mobileprovision
            security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
            /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.get-task-allow" "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true

            # Sign frameworks first with Apple timestamp
            if [ -d "$APP_PATH/Frameworks" ]; then
              find "$APP_PATH/Frameworks" -depth \( -name "*.framework" -o -name "*.dylib" \) | while read -r item; do
                echo "Signing: $item"
                codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp "$item" || true
              done
            fi

            # Sign main app bundle with entitlements, DER encoding, and Apple timestamp
            echo "Signing main app bundle with entitlements and Apple timestamp..."
            codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --generate-entitlement-der \
              --timestamp "$APP_PATH"
            echo "App signed successfully with App Store Distribution Profile!"
          else
            echo "No distribution certificate found. Applying ad-hoc signature for testing/sideloading..."
            find "$APP_PATH" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) | while read -r item; do
              codesign --force --sign - "$item" || true
            done
            codesign --force --deep --sign - "$APP_PATH" || true
            echo "App ad-hoc signed successfully for test packaging!"
          fi

          echo "Verifying app signature..."
          codesign -dvvv "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH" || true

          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -y -q VSG-Group.ipa Payload
          ls -lh VSG-Group.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSG-Group-ipa
          path: build/VSG-Group.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v161.0-b${{ env.APP_BUILD_NUMBER || github.run_number }}"
          name: "VSG Group iOS v161.0 Build ${{ env.APP_BUILD_NUMBER || github.run_number }}"
          files: build/VSG-Group.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
